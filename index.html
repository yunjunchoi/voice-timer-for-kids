<!DOCTYPE html>
<html lang="en"> <!-- 기본 언어는 영어로 시작 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kids Voice Timer</title>
    <style>
        :root {
            --primary-color: #FF9F1C;
            --bg-color: #F0F4F8;
            --text-color: #2D3748;
        }

        body {
            font-family: 'Jua', 'Gamja Flower', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #FF6B6B;
        }

        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e6e6e6;
        }

        .circle-progress {
            stroke: var(--primary-color);
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #4A5568;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 320px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #CBD5E0;
            border-radius: 10px;
        }

        select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #CBD5E0;
            background: white;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background-color: #48BB78;
            color: white;
        }

        .btn-stop {
            background-color: #F56565;
            color: white;
            display: none;
        }

        .btn-reset {
            background-color: #ED8936;
            color: white;
            display: none;
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <h1>🦊 Kids Voice Timer</h1>

    <div class="timer-container">
        <svg class="timer-circle">
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display" id="display">00:00</div>
    </div>

    <div class="controls">
        <div class="input-group" id="inputArea">
            <input type="number" id="minInput" placeholder="min" min="0" max="60" value="1">
            <input type="number" id="secInput" placeholder="sec" min="0" max="59" value="0">
        </div>

        <!-- 언어/음성 선택 -->
        <select id="voiceSelect">
            <!-- 4) 언어 선택 표시 -->
            <option value="default">언어 선택 (Language)</option>
        </select>

        <button class="btn-start" onclick="startTimer()">Start ▶️</button>
        <button class="btn-stop" onclick="stopTimer()">Pause ⏸️</button>
        <button class="btn-reset" onclick="resetTimer()">Reset ↺</button>
    </div>

    <script>
        let timerInterval;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let wakeLock = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let isRunning = false;
        let currentLangCode = 'en'; // 기본 언어는 영어

        const display = document.getElementById('display');
        const circleProgress = document.querySelector('.circle-progress');
        const voiceSelect = document.getElementById('voiceSelect');
        const fullDashArray = 880;

        // 2) html lang 동적으로 변경
        function setPageLanguage(langCode) {
            document.documentElement.setAttribute('lang', langCode);
            currentLangCode = langCode.split('-')[0]; // en-US -> en, ko-KR -> ko
        }

        // 1) 기본 언어는 영어
        setPageLanguage('en');

        function populateVoiceList() {
            let voices = synth.getVoices();
            voiceSelect.innerHTML = '';

            const labelOption = document.createElement('option');
            labelOption.textContent = '언어 선택 (Language)';
            labelOption.value = 'default';
            voiceSelect.appendChild(labelOption);

            if (voices.length > 0) {
                voices.sort((a, b) => {
                    const aEn = a.lang.startsWith('en');
                    const bEn = b.lang.startsWith('en');
                    if (aEn && !bEn) return -1;
                    if (!aEn && bEn) return 1;
                    return a.lang.localeCompare(b.lang);
                });

                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = index;
                    option.setAttribute('data-lang', voice.lang);

                    // 기본은 영어 음성을 우선 선택
                    if (voice.lang.startsWith('en') && voiceSelect.value === 'default') {
                        option.selected = true;
                        setPageLanguage(voice.lang); // 페이지 language도 영어 계열로
                    }
                    voiceSelect.appendChild(option);
                });
            }

            // 언어 선택이 변경될 때마다 페이지 lang도 변경
            voiceSelect.addEventListener('change', () => {
                const value = voiceSelect.value;
                if (value === 'default') {
                    setPageLanguage('en');
                    selectedVoice = null;
                } else {
                    const voices = synth.getVoices();
                    const v = voices[value];
                    if (v) {
                        selectedVoice = v;
                        setPageLanguage(v.lang);
                    }
                }
            });
        }

        populateVoiceList();

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        async function startTimer() {
            if (isRunning) return;

            if (remainingSeconds === 0) {
                const min = parseInt(document.getElementById('minInput').value) || 0;
                const sec = parseInt(document.getElementById('secInput').value) || 0;
                totalSeconds = min * 60 + sec;
                remainingSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) return alert("Set some time first!");

            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-stop').style.display = 'block';
            document.querySelector('.btn-reset').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('voiceSelect').style.display = 'none';

            isRunning = true;

            const voiceIndex = voiceSelect.value;
            const voices = synth.getVoices();
            if (voiceIndex !== 'default' && voices[voiceIndex]) {
                selectedVoice = voices[voiceIndex];
                setPageLanguage(selectedVoice.lang);
            } else {
                selectedVoice = null;
                setPageLanguage('en');
            }

            // 3) 시작 멘트도 언어별로
            speakStartMessage();

            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.log('Wake Lock failed:', err);
            }

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            updateDisplay();

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateDisplay();
                    checkAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200);
        }

        function stopTimer() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isRunning = false;

            document.querySelector('.btn-start').textContent = 'Resume ▶️';
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'block';

            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = 0;
            totalSeconds = 0;

            document.querySelector('.btn-start').textContent = 'Start ▶️';
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'none';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('voiceSelect').style.display = 'block';
            document.getElementById('display').classList.remove('pulse');
            document.getElementById('display').style.color = '#4A5568';

            display.textContent = "00:00";
            circleProgress.style.strokeDashoffset = 0;

            // 리셋 시 기본 언어 다시 영어
            setPageLanguage('en');
        }

        function finishTimer() {
            stopTimer();
            remainingSeconds = 0;
            updateDisplay();

            display.textContent = "Done!";
            document.getElementById('display').classList.add('pulse');
            document.getElementById('display').style.color = '#F56565';

            speakFinishMessage();

            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'block';
        }

        function updateDisplay() {
            const min = Math.floor(Math.max(remainingSeconds, 0) / 60);
            const sec = Math.max(remainingSeconds, 0) % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            if (totalSeconds > 0) {
                const clamped = Math.max(0, Math.min(remainingSeconds, totalSeconds));
                const offset = fullDashArray - (clamped / totalSeconds) * fullDashArray;
                circleProgress.style.strokeDashoffset = offset;
            }
        }

        function checkAnnounce(seconds) {
            if (seconds <= 0) return;

            let msg = "";

            if (seconds > 60 && seconds % 60 === 0) {
                msg = buildRemainingMessage(seconds);
            } else if (seconds === 60 || seconds === 30) {
                msg = buildRemainingMessage(seconds);
            } else if (seconds <= 10 && seconds > 0) {
                msg = buildCountdownMessage(seconds);
            }

            if (msg) speak(msg);
        }

        // 3) 언어별 멘트 생성
        function buildRemainingMessage(seconds) {
            const minutes = Math.floor(seconds / 60);

            if (currentLangCode === 'ko') {
                if (seconds === 60) return '1분 남았습니다.';
                if (seconds === 30) return '30초 남았습니다.';
                return `${minutes}분 남았습니다.`;
            } else if (currentLangCode === 'en') {
                if (seconds === 60) return 'One minute left.';
                if (seconds === 30) return 'Thirty seconds left.';
                return `${minutes} minutes left.`;
            } else {
                if (seconds === 60) return '1 minute remaining.';
                if (seconds === 30) return '30 seconds remaining.';
                return `${minutes} minutes remaining.`;
            }
        }

        function buildCountdownMessage(seconds) {
            if (currentLangCode === 'ko') {
                return `${seconds}`;
            } else if (currentLangCode === 'en') {
                return `${seconds}`;
            } else {
                return `${seconds}`;
            }
        }

        function speakStartMessage() {
            if (currentLangCode === 'ko') {
                speak('타이머를 시작합니다.');
            } else if (currentLangCode === 'en') {
                speak('Timer starts now.');
            } else {
                speak('The timer has started.');
            }
        }

        function speakFinishMessage() {
            if (currentLangCode === 'ko') {
                speak('시간이 종료되었습니다. 잘했어요!');
            } else if (currentLangCode === 'en') {
                speak("Time's up! Great job!");
            } else {
                speak('Timer finished. Well done!');
            }
        }

        function speak(text) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            synth.speak(utterance);
        }
    </script>
</body>
</html>
