<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kids Voice Timer</title>
    <style>
        :root {
            --primary-color: #FF9F1C;
            --bg-color: #F0F4F8;
            --text-color: #2D3748;
        }

        body {
            font-family: 'Jua', 'Gamja Flower', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #FF6B6B;
            text-align: center;
        }

        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e6e6e6;
        }

        .circle-progress {
            stroke: var(--primary-color);
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #4A5568;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 320px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #CBD5E0;
            border-radius: 10px;
        }

        select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #CBD5E0;
            background: white;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background-color: #48BB78;
            color: white;
        }

        .btn-stop {
            background-color: #F56565;
            color: white;
            display: none;
        }

        .btn-reset {
            background-color: #ED8936;
            color: white;
            display: none;
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <h1 id="ui-title">Kids Voice Timer</h1>

    <div class="timer-container">
        <svg class="timer-circle">
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display" id="display">00:00</div>
    </div>

    <div class="controls">
        <div class="input-group" id="inputArea">
            <input type="number" id="minInput" placeholder="min" min="0" max="60" value="1">
            <input type="number" id="secInput" placeholder="sec" min="0" max="59" value="0">
        </div>

        <select id="voiceSelect">
            <option value="default" id="ui-select-default">Language Selection</option>
        </select>

        <button class="btn-start" id="btn-start" onclick="startTimer()">Start ▶️</button>
        <button class="btn-stop" id="btn-stop" onclick="stopTimer()">Pause ⏸️</button>
        <button class="btn-reset" id="btn-reset" onclick="resetTimer()">Reset ↺</button>
    </div>

    <script>
        /**
         * 1. 다국어 딕셔너리 (여기서 언어별 문구 관리)
         * 필요한 언어가 있으면 여기에 추가하면 됩니다.
         */
        const translations = {
            'en': {
                title: "Kids Voice Timer",
                min_ph: "min",
                sec_ph: "sec",
                btn_start: "Start ▶️",
                btn_resume: "Resume ▶️",
                btn_pause: "Pause ⏸️",
                btn_reset: "Reset ↺",
                done_msg: "Done!",
                voice_start: "Start",
                voice_done: "Time is up! Good job.",
                voice_1min: "One minute left.",
                voice_30sec: "Thirty seconds left.",
                voice_xmin: "{m} minutes left.",
                select_default: "Select Language"
            },
            'ko': {
                title: "키즈 보이스 타이머",
                min_ph: "분",
                sec_ph: "초",
                btn_start: "시작하기 ▶️",
                btn_resume: "이어하기 ▶️",
                btn_pause: "잠깐 멈춤 ⏸️",
                btn_reset: "처음부터 ↺",
                done_msg: "끝!",
                voice_start: "시작",
                voice_done: "시간이 종료되었습니다! 참 잘했어요.",
                voice_1min: "1분 남았습니다.",
                voice_30sec: "30초 남았습니다.",
                voice_xmin: "{m}분 남았습니다.",
                select_default: "언어 선택 (Language)"
            },
            'ja': {
                title: "キッズボイスタイマー",
                min_ph: "分",
                sec_ph: "秒",
                btn_start: "スタート ▶️",
                btn_resume: "再開 ▶️",
                btn_pause: "一時停止 ⏸️",
                btn_reset: "リセット ↺",
                done_msg: "終了!",
                voice_start: "スタート",
                voice_done: "時間です！よくできました。",
                voice_1min: "あと1分です。",
                voice_30sec: "あと30秒です。",
                voice_xmin: "あと{m}分です。",
                select_default: "言語を選択"
            },
            'zh': {
                title: "儿童语音计时器",
                min_ph: "分",
                sec_ph: "秒",
                btn_start: "开始 ▶️",
                btn_resume: "继续 ▶️",
                btn_pause: "暂停 ⏸️",
                btn_reset: "重置 ↺",
                done_msg: "完成!",
                voice_start: "开始",
                voice_done: "时间到了！做得好。",
                voice_1min: "还剩1分钟。",
                voice_30sec: "还剩30秒。",
                voice_xmin: "还剩{m}分钟。",
                select_default: "选择语言"
            },
            'es': {
                title: "Temporizador de Voz",
                min_ph: "min",
                sec_ph: "seg",
                btn_start: "Iniciar ▶️",
                btn_resume: "Reanudar ▶️",
                btn_pause: "Pausa ⏸️",
                btn_reset: "Reiniciar ↺",
                done_msg: "¡Listo!",
                voice_start: "Comienzo",
                voice_done: "¡Se acabó el tiempo! Muy bien.",
                voice_1min: "Queda un minuto.",
                voice_30sec: "Quedan treinta segundos.",
                voice_xmin: "Quedan {m} minutos.",
                select_default: "Seleccionar idioma"
            }
        };

        // 전역 상태
        let timerInterval;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let wakeLock = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let isRunning = false;

        // 현재 언어 (기본값 영어)
        let currentLang = 'en';

        const display = document.getElementById('display');
        const circleProgress = document.querySelector('.circle-progress');
        const voiceSelect = document.getElementById('voiceSelect');
        const fullDashArray = 880;

        // UI 요소들
        const uiTitle = document.getElementById('ui-title');
        const uiMinInput = document.getElementById('minInput');
        const uiSecInput = document.getElementById('secInput');
        const uiBtnStart = document.getElementById('btn-start');
        const uiBtnStop = document.getElementById('btn-stop');
        const uiBtnReset = document.getElementById('btn-reset');
        const uiSelectDefault = document.getElementById('ui-select-default');

        // --- 2. 언어 및 UI 업데이트 로직 ---
        function updateUIText(langCode) {
            // 지원하지 않는 언어면 영어로 폴백
            const langData = translations[langCode] || translations['en'];

            // 페이지 언어 속성 변경
            document.documentElement.lang = langCode;
            currentLang = langCode;

            // 텍스트 교체
            uiTitle.textContent = langData.title;
            uiMinInput.placeholder = langData.min_ph;
            uiSecInput.placeholder = langData.sec_ph;
            uiSelectDefault.textContent = langData.select_default;

            // 버튼 상태에 따라 텍스트 갱신
            if(isRunning) {
                // 실행 중일 땐 Pause 버튼만 보임
                uiBtnStop.textContent = langData.btn_pause;
            } else {
                // 멈춰있을 때
                if(remainingSeconds > 0 && remainingSeconds < totalSeconds) {
                    uiBtnStart.textContent = langData.btn_resume;
                } else {
                    uiBtnStart.textContent = langData.btn_start;
                }
            }

            uiBtnReset.textContent = langData.btn_reset;
        }

        // 초기화 시 영어 적용
        updateUIText('en');

        // --- 3. 음성 목록 로딩 ---
        function populateVoiceList() {
            let voices = synth.getVoices();

            // 기존 옵션 지우고 기본값 다시 추가
            voiceSelect.innerHTML = '';
            voiceSelect.appendChild(uiSelectDefault);

            if (voices.length > 0) {
                // 언어별 정렬 (영어를 위로, 그다음 가나다순)
                voices.sort((a, b) => {
                    const aEn = a.lang.startsWith('en');
                    const bEn = b.lang.startsWith('en');
                    if (aEn && !bEn) return -1;
                    if (!aEn && bEn) return 1;
                    return a.lang.localeCompare(b.lang);
                });

                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    // UI에 보여질 이름: "Google US English (en-US)"
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = index;

                    // 언어 코드 추출 (ex: ko-KR -> ko)
                    const langCode = voice.lang.split('-')[0];
                    option.setAttribute('data-lang', langCode);

                    voiceSelect.appendChild(option);
                });
            }
        }

        populateVoiceList();

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // 음성 선택 시 이벤트 리스너
        voiceSelect.addEventListener('change', () => {
            const index = voiceSelect.value;
            if (index === 'default') {
                selectedVoice = null;
                updateUIText('en'); // 선택 해제 시 영어로 복귀
            } else {
                const voices = synth.getVoices();
                selectedVoice = voices[index];
                if (selectedVoice) {
                    // 선택된 음성의 언어 코드 (ko, en, ja...) 추출
                    const langCode = selectedVoice.lang.split('-')[0];
                    // 해당 언어로 UI 전체 변경
                    updateUIText(langCode);
                }
            }
        });

        // --- 4. 타이머 기능 ---
        async function startTimer() {
            if (isRunning) return;

            // 처음 시작일 때 시간 설정
            if (remainingSeconds === 0) {
                const min = parseInt(uiMinInput.value) || 0;
                const sec = parseInt(uiSecInput.value) || 0;
                totalSeconds = min * 60 + sec;
                remainingSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) {
                alert("Set some time first!");
                return;
            }

            // UI 변경
            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            voiceSelect.style.display = 'none';

            isRunning = true;

            // 음성으로 시작 알림
            const langData = translations[currentLang] || translations['en'];
            speak(langData.voice_start);

            // 화면 꺼짐 방지
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.log('Wake Lock failed:', err);
            }

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            updateDisplay();

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateDisplay();
                    checkAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200);
        }

        function stopTimer() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isRunning = false;

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_resume;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'block';

            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = 0;
            totalSeconds = 0;

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_start;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'none';
            document.getElementById('inputArea').style.display = 'flex';
            voiceSelect.style.display = 'block';
            display.classList.remove('pulse');
            display.style.color = '#4A5568';

            display.textContent = "00:00";
            circleProgress.style.strokeDashoffset = 0;
        }

        function finishTimer() {
            stopTimer();
            remainingSeconds = 0;
            updateDisplay();

            const langData = translations[currentLang] || translations['en'];
            display.textContent = langData.done_msg;
            display.classList.add('pulse');
            display.style.color = '#F56565';

            speak(langData.voice_done);

            uiBtnStart.style.display = 'none';
            uiBtnReset.style.display = 'block';
        }

        function updateDisplay() {
            const min = Math.floor(Math.max(remainingSeconds, 0) / 60);
            const sec = Math.max(remainingSeconds, 0) % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            if (totalSeconds > 0) {
                const clamped = Math.max(0, Math.min(remainingSeconds, totalSeconds));
                const offset = fullDashArray - (clamped / totalSeconds) * fullDashArray;
                circleProgress.style.strokeDashoffset = offset;
            }
        }

        function checkAnnounce(seconds) {
            if (seconds <= 0) return;

            const langData = translations[currentLang] || translations['en'];
            let msg = "";

            if (seconds === 60) {
                msg = langData.voice_1min;
            } else if (seconds === 30) {
                msg = langData.voice_30sec;
            } else if (seconds > 60 && seconds % 60 === 0) {
                const minutes = Math.floor(seconds / 60);
                msg = langData.voice_xmin.replace('{m}', minutes);
            } else if (seconds <= 10 && seconds > 0) {
                msg = String(seconds);
            }

            if (msg) speak(msg);
        }

        function speak(text) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            synth.speak(utterance);
        }
    </script>
</body>
</html>
