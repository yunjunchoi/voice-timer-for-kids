<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kids Voice Timer & Stopwatch</title>
    <style>
        :root {
            --primary-color: #FF9F1C;
            --text-color: #2D3748;
            --timer-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --stopwatch-bg: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Jua', 'Gamja Flower', 'Comic Sans MS', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            touch-action: manipulation;
            transition: background 0.5s ease;
        }

        body.mode-timer {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        body.mode-stopwatch {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        /* 탭 전환 */
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .mode-tab {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            color: #555;
        }

        .mode-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: scale(1.05);
        }

        .mode-tab:hover {
            transform: translateY(-2px);
        }

        /* 로고 */
        h1 { 
            margin-bottom: 25px; 
            font-size: 2.2rem; 
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            padding: 15px 25px;
            border-radius: 25px;
            transition: all 0.3s;
        }

        body.mode-timer h1 {
            color: #667eea;
        }

        body.mode-stopwatch h1 {
            color: #f5576c;
        }

        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }
        
        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        
        .timer-circle circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }
        
        .circle-bg { 
            stroke: rgba(255, 255, 255, 0.3);
        }
        
        .circle-progress { 
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        body.mode-timer .circle-progress {
            stroke: #667eea;
        }

        body.mode-stopwatch .circle-progress {
            stroke: #f5576c;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 80px;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-weight: bold;
        }

        /* 국기 선택 */
        .flag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }

        .flag-option {
            font-size: 2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.2s;
            background: transparent;
            border: 3px solid transparent;
        }

        .flag-option:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.8);
        }

        .flag-option.selected {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* 음성 선택 */
        select {
            padding: 14px;
            font-size: 1.05rem;
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
            font-weight: bold;
        }
        
        optgroup {
            font-weight: bold;
            color: #4A5568;
        }

        button {
            padding: 16px;
            font-size: 1.3rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        button:active { 
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .btn-start { 
            background: linear-gradient(135deg, #48BB78, #38a169);
            color: white; 
        }
        
        .btn-stop { 
            background: linear-gradient(135deg, #F56565, #e53e3e);
            color: white; 
            display: none;
        }
        
        .btn-reset { 
            background: linear-gradient(135deg, #ED8936, #dd6b20);
            color: white; 
            display: none;
        }

        .pulse { 
            animation: pulse 1s infinite; 
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .hidden { 
            display: none !important; 
        }

        /* 반응형 */
        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .timer-container { width: 250px; height: 250px; }
            .time-display { font-size: 2.8rem; }
        }
    </style>
</head>

        let currentMode = 'timer'; // 'timer' or 'stopwatch'
        let interval;

        let totalSeconds = 0;   // 타이머용 총 시간
        let remainingSeconds = 0; // 타이머용 남은 시간
        let wakeLock = null;

        let selectedVoice = null;
        let isRunning = false;

        let selectedFlag = null;
        let allVoices = [];

        const display = document.getElementById('display');
        const circleProgress = document.querySelector('.circle-progress');
        const voiceSelect = document.getElementById('voiceSelect');
        const flagSelector = document.getElementById('flagSelector');
        const uiTitle = document.getElementById('ui-title');
        const uiMinInput = document.getElementById('minInput');
        const uiSecInput = document.getElementById('secInput');
        const uiBtnStart = document.getElementById('btn-start');
        const uiBtnStop = document.getElementById('btn-stop');
        const uiBtnReset = document.getElementById('btn-reset');
        const inputArea = document.getElementById('inputArea');
        const fullDashArray = 880;

        // === 모드 전환 ===
        function switchMode(mode) {
            if (isRunning) {
                if (!confirm('Stop current activity and switch mode?')) return;
                resetAction();
            }

            currentMode = mode;
            document.body.className = `mode-${mode}`;
            
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            if (mode === 'timer') {
                inputArea.classList.remove('hidden');
                display.textContent = '00:00';
            } else {
                inputArea.classList.add('hidden');
                display.textContent = '00:00:00';
            }

            updateUIText(currentLang);
            resetProgress();
        }

        // === UI 업데이트 ===
        function updateUIText(langCode) {
            const langData = translations[langCode] || translations['en'];
            currentLang = langCode;
            document.documentElement.lang = langCode;

            if (currentMode === 'timer') {
                uiTitle.textContent = langData.timer_title;
                if (uiMinInput) uiMinInput.placeholder = langData.min_ph;
                if (uiSecInput) uiSecInput.placeholder = langData.sec_ph;
            } else {
                uiTitle.textContent = langData.stopwatch_title;
            }

            document.getElementById('ui-select-default').textContent = langData.select_default;

            if (isRunning) {
                uiBtnStop.textContent = langData.btn_pause;
            } else {
                if ((currentMode === 'timer' && remainingSeconds > 0 && remainingSeconds < totalSeconds) ||
                    (currentMode === 'stopwatch' && elapsedSeconds > 0)) {
                    uiBtnStart.textContent = langData.btn_resume;
                } else {
                    uiBtnStart.textContent = langData.btn_start;
                }
            }
            uiBtnReset.textContent = langData.btn_reset;
        }

        // === 국기 렌더링 ===
        function renderFlags() {
            flagSelector.innerHTML = '';
            Object.keys(flagToLang).forEach(flag => {
                const btn = document.createElement('button');
                btn.className = 'flag-option';
                btn.textContent = flag;
                btn.onclick = () => selectFlag(flag);
                flagSelector.appendChild(btn);
            });
        }

        // === 국기 선택 ===
        function selectFlag(flag) {
            selectedFlag = flag;
            
            // 시각적 표시
            document.querySelectorAll('.flag-option').forEach(opt => {
                opt.classList.toggle('selected', opt.textContent === flag);
            });

            // 해당 국가 언어로 음성 필터링
            filterVoicesByFlag(flag);
        }

        // === 국기별 음성 필터링 ===
        function filterVoicesByFlag(flag) {
            const targetLangs = flagToLang[flag] || [];
            
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'default';
            defaultOpt.id = 'ui-select-default';
            defaultOpt.textContent = translations[currentLang]?.select_default || 'Select Voice';
            voiceSelect.appendChild(defaultOpt);

            const filtered = allVoices.filter(v => {
                const baseLang = v.lang.split('-')[0].toLowerCase();
                return targetLangs.some(tl => baseLang === tl.toLowerCase());
            });

            if (filtered.length === 0) {
                const noVoice = document.createElement('option');
                noVoice.textContent = '(No voices available)';
                noVoice.disabled = true;
                voiceSelect.appendChild(noVoice);
                return;
            }

            filtered.forEach((voice, idx) => {
                const option = document.createElement('option');
                option.textContent = voice.name;
                option.value = idx;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-original-index', allVoices.indexOf(voice));
                voiceSelect.appendChild(option);
            });

            // 자동으로 첫 번째 음성 선택
            if (filtered.length > 0) {
                voiceSelect.selectedIndex = 1;
                voiceSelect.dispatchEvent(new Event('change'));
            }
        }

        // === 음성 목록 로딩 ===
        function loadVoices() {
            allVoices = synth.getVoices();
            
            // 기본 렌더링 (모든 음성)
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'default';
            defaultOpt.id = 'ui-select-default';
            defaultOpt.textContent = 'Select Voice';
            voiceSelect.appendChild(defaultOpt);

            allVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = index;
                voiceSelect.appendChild(option);
            });
        }

        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // === 음성 선택 핸들러 ===
        voiceSelect.addEventListener('change', () => {
            const index = voiceSelect.value;
            
            if (index === 'default') {
                selectedVoice = null;
                updateUIText('en');
            } else {
                const originalIndex = voiceSelect.options[voiceSelect.selectedIndex].getAttribute('data-original-index');
                selectedVoice = allVoices[originalIndex || index];
                
                if (selectedVoice) {
                    const baseLang = selectedVoice.lang.split('-')[0];
                    updateUIText(baseLang);
                }
            }
        });

        // === 시작 ===
        async function startAction() {
            if (isRunning) return;

            if (currentMode === 'timer') {
                if (remainingSeconds === 0) {
                    const min = parseInt(uiMinInput.value) || 0;
                    const sec = parseInt(uiSecInput.value) || 0;
                    totalSeconds = min * 60 + sec;
                    remainingSeconds = totalSeconds;
                }
                if (totalSeconds <= 0) return alert("Please set time!");
                startTimer();
            } else {
                startStopwatch();
            }

            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { 
                console.log('WakeLock error:', err); 
            }
        }

        // === 타이머 시작 ===
        function startTimer() {
            isRunning = true;
            
            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            inputArea.style.display = 'none';
            flagSelector.style.display = 'none';
            voiceSelect.style.display = 'none';

            const langData = translations[currentLang] || translations['en'];
            speak(langData.voice_start);

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            interval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateTimerDisplay();
                    checkTimerAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200);
        }

        // === 스톱워치 시작 ===
        function startStopwatch() {
            isRunning = true;
            
            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            flagSelector.style.display = 'none';
            voiceSelect.style.display = 'none';

            const langData = translations[currentLang] || translations['en'];
            speak(langData.voice_start);

            const startTime = Date.now();
            const initialElapsed = elapsedSeconds;

            interval = setInterval(() => {
                const delta = Math.floor((Date.now() - startTime) / 1000);
                elapsedSeconds = initialElapsed + delta;
                updateStopwatchDisplay();
                checkStopwatchAnnounce(elapsedSeconds);
            }, 200);
        }

        // === 멈춤 ===
        function stopAction() {
            if (!isRunning) return;
            clearInterval(interval);
            isRunning = false;

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_resume;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'block';

            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        // === 리셋 ===
        function resetAction() {
            stopAction();
            
            elapsedSeconds = 0;
            remainingSeconds = 0;
            totalSeconds = 0;

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_start;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'none';

            if (currentMode === 'timer') {
                inputArea.style.display = 'flex';
                display.textContent = '00:00';
            } else {
                display.textContent = '00:00:00';
            }

            flagSelector.style.display = 'flex';
            voiceSelect.style.display = 'block';

            display.classList.remove('pulse');
            display.style.color = '#fff';
            resetProgress();
        }

        // === 타이머 완료 ===
        function finishTimer() {
            stopAction();
            remainingSeconds = 0;
            
            const langData = translations[currentLang] || translations['en'];
            display.textContent = langData.done_msg;
            display.classList.add('pulse');
            display.style.color = '#FFD700';

            speak(langData.voice_done);
            
            uiBtnStart.style.display = 'none';
            uiBtnReset.style.display = 'block';
        }

        // === 타이머 디스플레이 업데이트 ===
        function updateTimerDisplay() {
            const min = Math.floor(Math.max(remainingSeconds, 0) / 60);
            const sec = Math.max(remainingSeconds, 0) % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            if (totalSeconds > 0) {
                const clamped = Math.max(0, Math.min(remainingSeconds, totalSeconds));
                const offset = fullDashArray - (clamped / totalSeconds) * fullDashArray;
                circleProgress.style.strokeDashoffset = offset;
            }
        }

        // === 스톱워치 디스플레이 업데이트 ===
        function updateStopwatchDisplay() {
            const hrs = Math.floor(elapsedSeconds / 3600);
            const min = Math.floor((elapsedSeconds % 3600) / 60);
            const sec = elapsedSeconds % 60;
            display.textContent = `${String(hrs).padStart(2, '0')}:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            // 진행바: 최대 1시간 기준으로 순환
            const maxSeconds = 3600;
            const progress = (elapsedSeconds % maxSeconds) / maxSeconds;
            const offset = fullDashArray - (progress * fullDashArray);
            circleProgress.style.strokeDashoffset = offset;
        }

        // === 타이머 안내 음성 ===
        function checkTimerAnnounce(seconds) {
            if (seconds <= 0) return;
            
            const langData = translations[currentLang] || translations['en'];
            let msg = "";

            if (seconds > 60 && seconds % 60 === 0) {
                msg = langData.voice_xmin.replace('{m}', seconds / 60);
            } else if (seconds === 60) {
                msg = langData.voice_1min;
            } else if (seconds === 30) {
                msg = langData.voice_30sec;
            } else if (seconds <= 10) {
                msg = `${seconds}`;
            }

            if (msg) speak(msg);
        }

        // === 스톱워치 안내 음성 ===
        function checkStopwatchAnnounce(seconds) {
            const langData = translations[currentLang] || translations['en'];
            let msg = "";

            if (seconds > 0 && seconds % 3600 === 0) {
                const hrs = seconds / 3600;
                if (hrs === 1) {
                    msg = langData.voice_1hr;
                } else {
                    msg = langData.voice_xhrs.replace('{h}', hrs);
                }
            } else if (seconds > 0 && seconds % 60 === 0 && seconds < 3600) {
                const mins = seconds / 60;
                msg = langData.voice_xmin.replace('{m}', mins);
            }

            if (msg) speak(msg);
        }

        // === 음성 출력 ===
        function speak(text) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = 'en-US';
            }
            
            utterance.rate = 1.0;
            utterance.pitch = 1.1;
            synth.speak(utterance);
        }

        // === 진행바 리셋 ===
        function resetProgress() {
            circleProgress.style.strokeDashoffset = 0;
        }

        // === 초기화 ===
        renderFlags();
        updateUIText('en');
    </script>
</body>
</html>
