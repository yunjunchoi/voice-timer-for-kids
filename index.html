<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes"> <!-- iOS 전체화면 -->
    <title>Kids Voice Timer</title>
    <style>
        /* 1. 아이들을 위한 직관적이고 깔끔한 디자인 (CSS) */
        :root {
            --primary-color: #FF9F1C;
            --bg-color: #F0F4F8;
            --text-color: #2D3748;
        }

        body {
            font-family: 'Jua', 'Gamja Flower', sans-serif; /* 귀여운 폰트 계열 (시스템에 없으면 고딕) */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #FF6B6B;
        }

        /* 타이머 시각화 (원형 프로그레스) */
        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e6e6e6;
        }

        .circle-progress {
            stroke: var(--primary-color);
            stroke-dasharray: 880; /* 2 * PI * R (approx) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #4A5568;
        }

        /* 컨트롤 패널 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 320px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #CBD5E0;
            border-radius: 10px;
        }

        select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #CBD5E0;
            background: white;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background-color: #48BB78;
            color: white;
        }

        .btn-stop {
            background-color: #F56565;
            color: white;
            display: none;
        }

        .btn-reset {
            background-color: #ED8936;
            color: white;
            display: none;
        }

        /* 애니메이션 효과 */
        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <h1>🦊 키즈 보이스 타이머</h1>

    <div class="timer-container">
        <svg class="timer-circle">
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display" id="display">00:00</div>
    </div>

    <div class="controls">
        <div class="input-group" id="inputArea">
            <input type="number" id="minInput" placeholder="분" min="0" max="60" value="1">
            <input type="number" id="secInput" placeholder="초" min="0" max="59" value="0">
        </div>

        <!-- 2. 안드로이드 호환성을 위한 음성 선택기 -->
        <select id="voiceSelect">
            <option value="default">기기 기본 음성 (로딩중...)</option>
        </select>

        <button class="btn-start" onclick="startTimer()">시작하기 ▶️</button>
        <button class="btn-stop" onclick="stopTimer()">멈추기 ⏸️</button>
        <button class="btn-reset" onclick="resetTimer()">다시하기 ↺</button>
    </div>

    <script>
        // --- 3. 변수 및 상태 관리 ---
        let timerInterval;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let wakeLock = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let isRunning = false;

        const display = document.getElementById('display');
        const circleProgress = document.querySelector('.circle-progress');
        const voiceSelect = document.getElementById('voiceSelect');

        // 원형 그래프 둘레 길이 (2 * PI * 140 ≈ 880)
        const fullDashArray = 880;

        // --- 4. 음성 로딩 (안드로이드 이슈 해결 핵심) ---
        function populateVoiceList() {
            let voices = synth.getVoices();
            // 안드로이드 크롬은 getVoices가 빈 배열일 때가 많으므로 재시도 로직이 필요할 수 있으나
            // onvoiceschanged 이벤트로 처리하는 것이 정석입니다.

            voiceSelect.innerHTML = '';

            // "기본값" 옵션 추가 (목록 로딩 실패 대비)
            const defaultOption = document.createElement('option');
            defaultOption.textContent = '기기 기본 음성 (권장)';
            defaultOption.value = 'default';
            voiceSelect.appendChild(defaultOption);

            if(voices.length > 0) {
                // 한국어 우선 정렬
                voices.sort((a, b) => {
                    const aKor = a.lang.includes('ko');
                    const bKor = b.lang.includes('ko');
                    if (aKor && !bKor) return -1;
                    if (!aKor && bKor) return 1;
                    return 0;
                });

                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = index;

                    // 한국어 음성이면 기본 선택
                    if (voice.lang.includes('ko-KR') && !selectedVoice) {
                        option.selected = true;
                    }
                    voiceSelect.appendChild(option);
                });
            }
        }

        populateVoiceList();

        // 크롬/안드로이드에서 음성 목록이 늦게 로드될 때 실행됨
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // --- 5. 타이머 로직 (Drift 보정 적용) ---
        async function startTimer() {
            if (isRunning) return;

            // 시간 설정 (최초 시작 시에만)
            if (remainingSeconds === 0) {
                const min = parseInt(document.getElementById('minInput').value) || 0;
                const sec = parseInt(document.getElementById('secInput').value) || 0;
                totalSeconds = min * 60 + sec;
                remainingSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) return alert("시간을 설정해주세요!");

            // UI 변경
            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-stop').style.display = 'block';
            document.querySelector('.btn-reset').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('voiceSelect').style.display = 'none';

            isRunning = true;

            // 음성 설정 확인
            const voiceIndex = voiceSelect.value;
            const voices = synth.getVoices();
            if (voiceIndex !== 'default' && voices[voiceIndex]) {
                selectedVoice = voices[voiceIndex];
            } else {
                selectedVoice = null; // null이면 브라우저 기본값 사용
            }

            speak("타이머를 시작합니다.");

            // 6. 화면 꺼짐 방지 (Wake Lock API)
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('화면 꺼짐 방지 활성화');
            } catch (err) {
                console.log('Wake Lock 실패:', err);
            }

            // 정확한 타이머를 위해 Date.now() 활용
            const startTime = Date.now();
            const initialRemaining = remainingSeconds; // 재시작 시점의 남은 시간

            updateDisplay(); // 즉시 갱신

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateDisplay();
                    checkAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200); // 1초보다 짧게 체크하여 딜레이 방지
        }

        function stopTimer() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isRunning = false;

            // UI 변경
            document.querySelector('.btn-start').textContent = '이어하기 ▶️';
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'block';

            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = 0;
            totalSeconds = 0;

            // UI 초기화
            document.querySelector('.btn-start').textContent = '시작하기 ▶️';
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'none';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('voiceSelect').style.display = 'block';
            document.getElementById('display').classList.remove('pulse');
            document.getElementById('display').style.color = '#4A5568';

            display.textContent = "00:00";
            circleProgress.style.strokeDashoffset = 0;
        }

        function finishTimer() {
            stopTimer();
            remainingSeconds = 0;
            updateDisplay();

            display.textContent = "끝!";
            document.getElementById('display').classList.add('pulse');
            document.getElementById('display').style.color = '#F56565'; // 빨간색 강조

            speak("시간이 종료되었습니다! 참 잘했어요.");

            // 종료 UI 처리
            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-reset').style.display = 'block';
        }

        function updateDisplay() {
            const min = Math.floor(remainingSeconds / 60);
            const sec = remainingSeconds % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            // 원형 그래프 업데이트
            if (totalSeconds > 0) {
                const offset = fullDashArray - (remainingSeconds / totalSeconds) * fullDashArray;
                circleProgress.style.strokeDashoffset = offset;
            }
        }

        // --- 7. 음성 안내 로직 ---
        function checkAnnounce(seconds) {
            let msg = "";

            // 1분 이상일 때 매 분마다 알림
            if (seconds > 60 && seconds % 60 === 0) {
                msg = `${seconds / 60}분 남았습니다.`;
            }
            // 1분, 30초 알림
            else if (seconds === 60) {
                msg = "1분 남았습니다.";
            } else if (seconds === 30) {
                msg = "30초 남았습니다.";
            }
            // 마지막 10초 카운트다운
            else if (seconds <= 10 && seconds > 0) {
                msg = `${seconds}`;
            }

            if (msg) speak(msg);
        }

        function speak(text) {
            // 진행 중인 음성 취소 (겹침 방지)
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            // 선택된 음성 적용 (없으면 기본값)
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.rate = 1.0; // 속도
            utterance.pitch = 1.1; // 아이들을 위해 약간 높은 톤

            synth.speak(utterance);
        }
    </script>
</body>
</html>
