<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kids Voice Timer & Stopwatch</title>
    <style>
        :root {
            --primary-color: #FF9F1C;
            --text-color: #2D3748;
            --timer-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --stopwatch-bg: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Jua', 'Gamja Flower', 'Comic Sans MS', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            touch-action: manipulation;
            transition: background 0.5s ease;
        }

        body.mode-timer {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        body.mode-stopwatch {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        /* 탭 전환 */
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .mode-tab {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            color: #555;
        }

        .mode-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: scale(1.05);
        }

        .mode-tab:hover {
            transform: translateY(-2px);
        }

        /* 로고 */
        h1 { 
            margin-bottom: 25px; 
            font-size: 2.2rem; 
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            padding: 15px 25px;
            border-radius: 25px;
            transition: all 0.3s;
        }

        body.mode-timer h1 {
            color: #667eea;
        }

        body.mode-stopwatch h1 {
            color: #f5576c;
        }

        .timer-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
        }
        
        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        
        .timer-circle circle {
            fill: none;
            stroke-linecap: round;
        }
        
        /* 3중 동심원 (Stopwatch용) */
        .circle-bg { 
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 12;
        }
        
        /* Timer용 단일 원 */
        .circle-progress-single { 
            stroke-width: 15;
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        /* Stopwatch용 3중 원 */
        .circle-10sec {
            stroke: #FFD700;
            stroke-width: 8;
            stroke-dasharray: 754; /* 2πr, r=120 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.2s linear;
        }

        .circle-1min {
            stroke: #FF6B9D;
            stroke-width: 10;
            stroke-dasharray: 628; /* 2πr, r=100 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.2s linear;
        }

        .circle-60min {
            stroke: #667eea;
            stroke-width: 12;
            stroke-dasharray: 502; /* 2πr, r=80 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.2s linear;
        }

        body.mode-timer .circle-progress-single {
            stroke: #667eea;
        }

        .time-display-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time-display {
            font-size: 3.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            margin: 0;
        }

        .seconds-display {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 5px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        /* 입력 그룹 개선 */
        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .input-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #667eea;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        input[type="number"] {
            width: 90px;
            padding: 12px;
            font-size: 1.3rem;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-weight: bold;
        }

        /* 국기 선택 */
        .flag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }

        .flag-option {
            font-size: 2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.2s;
            background: transparent;
            border: 3px solid transparent;
        }

        .flag-option:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.8);
        }

        .flag-option.selected {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* 음성 선택 */
        select {
            padding: 14px;
            font-size: 1.05rem;
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
            font-weight: bold;
        }
        
        optgroup {
            font-weight: bold;
            color: #4A5568;
        }

        /* 음성 속도 조절 슬라이더 */
        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }

        .speed-label {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #667eea;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .speed-value {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f5576c;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9);
        }

        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: linear-gradient(to right, #48BB78 0%, #667eea 50%, #F56565 100%);
            outline: none;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .speed-slider:hover {
            opacity: 1;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .speed-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }

        .speed-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .speed-slider::-moz-range-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }

        button {
            padding: 16px;
            font-size: 1.3rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        button:active { 
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .btn-start { 
            background: linear-gradient(135deg, #48BB78, #38a169);
            color: white; 
        }
        
        .btn-stop { 
            background: linear-gradient(135deg, #F56565, #e53e3e);
            color: white; 
            display: none;
        }
        
        .btn-reset { 
            background: linear-gradient(135deg, #ED8936, #dd6b20);
            color: white; 
            display: none;
        }

        .pulse { 
            animation: pulse 1s infinite; 
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hidden { 
            display: none !important; 
        }

        /* 반응형 */
        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .timer-container { width: 280px; height: 280px; }
            .time-display { font-size: 2.6rem; }
            .seconds-display { font-size: 0.95rem; }
        }
    </style>
</head>
<body class="mode-timer">

    <!-- 모드 전환 탭 -->
    <div class="mode-tabs">
        <button class="mode-tab active" onclick="switchMode('timer')">⏱️ Timer</button>
        <button class="mode-tab" onclick="switchMode('stopwatch')">⏲️ Stopwatch</button>
    </div>

    <!-- 로고 -->
    <h1 id="ui-title">🦊 Kids Voice Timer</h1>

    <!-- 타이머/스톱워치 원형 -->
    <div class="timer-container">
        <svg class="timer-circle" id="timerSvg">
            <!-- Timer 모드: 단일 원 -->
            <circle class="circle-bg" cx="160" cy="160" r="140"></circle>
            <circle class="circle-progress-single" id="progressSingle" cx="160" cy="160" r="140"></circle>
            
            <!-- Stopwatch 모드: 3중 동심원 (배경원 제거, 진행원만 표시) -->
            <circle class="circle-10sec" id="progress10sec" cx="160" cy="160" r="120" style="display:none;"></circle>
            
            <circle class="circle-bg" id="bg1min" cx="160" cy="160" r="100" style="display:none;"></circle>
            <circle class="circle-1min" id="progress1min" cx="160" cy="160" r="100" style="display:none;"></circle>
            
            <circle class="circle-bg" id="bg60min" cx="160" cy="160" r="80" style="display:none;"></circle>
            <circle class="circle-60min" id="progress60min" cx="160" cy="160" r="80" style="display:none;"></circle>
        </svg>
        
        <div class="time-display-wrapper">
            <div class="time-display" id="display">00:00</div>
            <div class="seconds-display" id="secondsDisplay">Total: 0 seconds</div>
        </div>
    </div>

    <div class="controls">
        <!-- 타이머 입력 (Timer 모드에서만) -->
        <div class="input-group" id="inputArea">
            <div class="input-wrapper">
                <span class="input-label" id="labelMin">Minutes</span>
                <input type="number" id="minInput" placeholder="0" min="0" max="60" value="1">
            </div>
            <div class="input-wrapper">
                <span class="input-label" id="labelSec">Seconds</span>
                <input type="number" id="secInput" placeholder="0" min="0" max="59" value="0">
            </div>
        </div>

        <!-- 국기 선택 -->
        <div class="flag-selector" id="flagSelector"></div>

        <!-- 음성 선택 -->
        <select id="voiceSelect">
            <option value="default" id="ui-select-default">Select Voice</option>
        </select>

        <!-- 음성 속도 조절 -->
        <div class="speed-control">
            <div class="speed-label" id="speedLabel">🎵 Voice Speed</div>
            <div class="speed-value" id="speedValue">1.2x</div>
            <input type="range" class="speed-slider" id="speedSlider" 
                   min="0.5" max="2.0" step="0.1" value="1.2">
        </div>

        <button class="btn-start" id="btn-start" onclick="startAction()">Start ▶</button>
        <button class="btn-stop" id="btn-stop" onclick="stopAction()">Pause ⏸</button>
        <button class="btn-reset" id="btn-reset" onclick="resetAction()">Reset ↺</button>
    </div>

                btn_pause: "إيقاف ⏸", btn_reset: "إعادة تعيين ↺",
                done_msg: "انتهى!", started_msg: "بدأ!",
                voice_start: "ابدأ",
                voice_done: "انتهى الوقت! أحسنت.",
                voice_1min: "دقيقة واحدة متبقية.",
                voice_30sec: "ثلاثون ثانية متبقية.",
                voice_xmin: "{m} دقائق متبقية.",
                voice_1hr: "مضت ساعة واحدة.",
                voice_xhrs: "مضت {h} ساعات.",
                select_default: "اختر الصوت"
            },
            'hi': {
                timer_title: "🦊 किड्स वॉयस टाइमर",
                stopwatch_title: "🦊 किड्स वॉयस स्टॉपवॉच",
                label_min: "मिनट", label_sec: "सेकंड",
                total_sec: "कुल: {s} सेकंड",
                speed_label: "🎵 आवाज़ की गति",
                btn_start: "शुरू करें ▶", btn_resume: "फिर से शुरू ▶",
                btn_pause: "रोकें ⏸", btn_reset: "रीसेट ↺",
                done_msg: "पूरा हुआ!", started_msg: "शुरू हुआ!",
                voice_start: "शुरू",
                voice_done: "समय समाप्त! शाबाश।",
                voice_1min: "एक मिनट बचा है।",
                voice_30sec: "तीस सेकंड बचे हैं।",
                voice_xmin: "{m} मिनट बचे हैं।",
                voice_1hr: "एक घंटा बीत गया।",
                voice_xhrs: "{h} घंटे बीत गए।",
                select_default: "आवाज़ चुनें"
            }
        };

        // 국기 → 언어 매핑
        const flagToLang = {
            '🇺🇸': ['en'],
            '🇰🇷': ['ko'],
            '🇯🇵': ['ja'],
            '🇨🇳': ['zh', 'cmn', 'yue'],
            '🇪🇸': ['es'],
            '🇫🇷': ['fr'],
            '🇩🇪': ['de'],
            '🇮🇹': ['it'],
            '🇵🇹': ['pt'],
            '🇷🇺': ['ru'],
            '🇸🇦': ['ar'],
            '🇮🇳': ['hi', 'bn', 'te', 'ta', 'mr', 'gu']
        };

        // === 전역 상태 ===
        let currentMode = 'timer';
        let interval;
        let elapsedSeconds = 0;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let wakeLock = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let isRunning = false;
        let currentLang = 'en';
        let selectedFlag = null;
        let allVoices = [];
        let lastSpokenSecond = -1; // 음성 중복 방지용
        let userSpeedMultiplier = 1.2; // 사용자 설정 속도 배율 (현재 설정값)

        // === DOM 요소 ===
        const display = document.getElementById('display');
        const secondsDisplay = document.getElementById('secondsDisplay');
        const progressSingle = document.getElementById('progressSingle');
        const progress10sec = document.getElementById('progress10sec');
        const progress1min = document.getElementById('progress1min');
        const progress60min = document.getElementById('progress60min');
        const bg1min = document.getElementById('bg1min');
        const bg60min = document.getElementById('bg60min');
        const voiceSelect = document.getElementById('voiceSelect');
        const flagSelector = document.getElementById('flagSelector');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const speedLabel = document.getElementById('speedLabel');
        const uiTitle = document.getElementById('ui-title');
        const labelMin = document.getElementById('labelMin');
        const labelSec = document.getElementById('labelSec');
        const uiMinInput = document.getElementById('minInput');
        const uiSecInput = document.getElementById('secInput');
        const uiBtnStart = document.getElementById('btn-start');
        const uiBtnStop = document.getElementById('btn-stop');
        const uiBtnReset = document.getElementById('btn-reset');
        const inputArea = document.getElementById('inputArea');

        const singleCircleDashArray = 880; // 2πr, r=140
        const circle10secDashArray = 754; // 2πr, r=120
        const circle1minDashArray = 628;  // 2πr, r=100
        const circle60minDashArray = 502; // 2πr, r=80

        // === 모드 전환 ===
        function switchMode(mode) {
            if (isRunning) {
                if (!confirm('Stop current activity and switch mode?')) return;
                resetAction();
            }

            currentMode = mode;
            document.body.className = `mode-${mode}`;
            
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            if (mode === 'timer') {
                inputArea.classList.remove('hidden');
                display.textContent = '00:00';
                secondsDisplay.textContent = 'Total: 0 seconds';
                
                // Timer 원만 표시
                progressSingle.style.display = 'block';
                progress10sec.style.display = 'none';
                progress1min.style.display = 'none';
                progress60min.style.display = 'none';
                bg1min.style.display = 'none';
                bg60min.style.display = 'none';
            } else {
                inputArea.classList.add('hidden');
                display.textContent = '00:00:00';
                secondsDisplay.textContent = 'Total: 0 seconds';
                
                // Stopwatch 3중 원 표시
                progressSingle.style.display = 'none';
                progress10sec.style.display = 'block';
                progress1min.style.display = 'block';
                progress60min.style.display = 'block';
                bg1min.style.display = 'block';
                bg60min.style.display = 'block';
            }

            updateUIText(currentLang);
            resetProgress();
        }

        // === UI 업데이트 ===
        function updateUIText(langCode) {
            const langData = translations[langCode] || translations['en'];
            currentLang = langCode;
            document.documentElement.lang = langCode;

            if (currentMode === 'timer') {
                uiTitle.textContent = langData.timer_title;
                labelMin.textContent = langData.label_min;
                labelSec.textContent = langData.label_sec;
            } else {
                uiTitle.textContent = langData.stopwatch_title;
            }

            document.getElementById('ui-select-default').textContent = langData.select_default;
            speedLabel.textContent = langData.speed_label;

            if (isRunning) {
                uiBtnStop.textContent = langData.btn_pause;
            } else {
                if ((currentMode === 'timer' && remainingSeconds > 0 && remainingSeconds < totalSeconds) ||
                    (currentMode === 'stopwatch' && elapsedSeconds > 0)) {
                    uiBtnStart.textContent = langData.btn_resume;
                } else {
                    uiBtnStart.textContent = langData.btn_start;
                }
            }
            uiBtnReset.textContent = langData.btn_reset;
            
            updateSecondsDisplay();
        }

        // === 총 초 표시 업데이트 ===
        function updateSecondsDisplay() {
            const langData = translations[currentLang] || translations['en'];
            let totalSecs = currentMode === 'timer' ? remainingSeconds : elapsedSeconds;
            secondsDisplay.textContent = langData.total_sec.replace('{s}', totalSecs);
        }

        // === 국기 렌더링 ===
        function renderFlags() {
            flagSelector.innerHTML = '';
            Object.keys(flagToLang).forEach(flag => {
                const btn = document.createElement('button');
                btn.className = 'flag-option';
                btn.textContent = flag;
                btn.onclick = () => selectFlag(flag);
                flagSelector.appendChild(btn);
            });
        }

        // === 국기 선택 ===
        function selectFlag(flag) {
            selectedFlag = flag;
            
            document.querySelectorAll('.flag-option').forEach(opt => {
                opt.classList.toggle('selected', opt.textContent === flag);
            });

            // 국기에 따라 UI 언어 변경
            const targetLangs = flagToLang[flag] || ['en'];
            const uiLang = targetLangs[0]; // 첫 번째 언어를 UI 언어로
            updateUIText(uiLang);

            filterVoicesByFlag(flag);
        }

        // === 국기별 음성 필터링 ===
        function filterVoicesByFlag(flag) {
            const targetLangs = flagToLang[flag] || [];
            
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'default';
            defaultOpt.id = 'ui-select-default';
            defaultOpt.textContent = translations[currentLang]?.select_default || 'Select Voice';
            voiceSelect.appendChild(defaultOpt);

            const filtered = allVoices.filter(v => {
                const baseLang = v.lang.split('-')[0].toLowerCase();
                return targetLangs.some(tl => baseLang === tl.toLowerCase());
            });

            if (filtered.length === 0) {
                const noVoice = document.createElement('option');
                noVoice.textContent = '(No voices available)';
                noVoice.disabled = true;
                voiceSelect.appendChild(noVoice);
                return;
            }

            filtered.forEach((voice, idx) => {
                const option = document.createElement('option');
                option.textContent = voice.name;
                option.value = idx;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-original-index', allVoices.indexOf(voice));
                voiceSelect.appendChild(option);
            });

            if (filtered.length > 0) {
                voiceSelect.selectedIndex = 1;
                voiceSelect.dispatchEvent(new Event('change'));
            }
        }

        // === 음성 목록 로딩 ===
        function loadVoices() {
            allVoices = synth.getVoices();
            
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'default';
            defaultOpt.id = 'ui-select-default';
            defaultOpt.textContent = 'Select Voice';
            voiceSelect.appendChild(defaultOpt);

            allVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = index;
                voiceSelect.appendChild(option);
            });
        }

        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // === 음성 선택 핸들러 ===
        voiceSelect.addEventListener('change', () => {
            const index = voiceSelect.value;
            
            if (index === 'default') {
                selectedVoice = null;
            } else {
                const originalIndex = parseInt(voiceSelect.options[voiceSelect.selectedIndex].getAttribute('data-original-index'));
                selectedVoice = allVoices[originalIndex];
                console.log('Selected voice:', selectedVoice?.name, selectedVoice?.lang);
            }
        });

        // === 시작 ===
        async function startAction() {
            if (isRunning) return;

            if (currentMode === 'timer') {
                if (remainingSeconds === 0) {
                    const min = parseInt(uiMinInput.value) || 0;
                    const sec = parseInt(uiSecInput.value) || 0;
                    totalSeconds = min * 60 + sec;
                    remainingSeconds = totalSeconds;
                }
                if (totalSeconds <= 0) return alert("Please set time!");
                startTimer();
            } else {
                startStopwatch();
            }

            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { 
                console.log('WakeLock error:', err); 
            }
        }

        // === 타이머 시작 ===
        function startTimer() {
            isRunning = true;
            lastSpokenSecond = -1; // 음성 카운터 초기화
            
            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            inputArea.style.display = 'none';
            flagSelector.style.display = 'none';
            voiceSelect.style.display = 'none';

            const langData = translations[currentLang] || translations['en'];
            speak(langData.voice_start);

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            interval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateTimerDisplay();
                    checkTimerAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200);
        }

        // === 스톱워치 시작 ===
        function startStopwatch() {
            isRunning = true;
            lastSpokenSecond = -1; // 음성 카운터 초기화
            
            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            flagSelector.style.display = 'none';
            voiceSelect.style.display = 'none';

            const langData = translations[currentLang] || translations['en'];
            speak(langData.voice_start);

            const startTime = Date.now();
            const initialElapsed = elapsedSeconds;

            interval = setInterval(() => {
                const delta = Math.floor((Date.now() - startTime) / 1000);
                elapsedSeconds = initialElapsed + delta;
                updateStopwatchDisplay();
                checkStopwatchAnnounce(elapsedSeconds);
            }, 200);
        }

        // === 멈춤 ===
        function stopAction() {
            if (!isRunning) return;
            clearInterval(interval);
            isRunning = false;

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_resume;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'block';

            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        // === 리셋 ===
        function resetAction() {
            stopAction();
            
            elapsedSeconds = 0;
            remainingSeconds = 0;
            totalSeconds = 0;
            lastSpokenSecond = -1; // 음성 카운터 초기화

            const langData = translations[currentLang] || translations['en'];
            uiBtnStart.textContent = langData.btn_start;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'none';

            if (currentMode === 'timer') {
                inputArea.style.display = 'flex';
                display.textContent = '00:00';
            } else {
                display.textContent = '00:00:00';
            }

            flagSelector.style.display = 'flex';
            voiceSelect.style.display = 'block';

            display.classList.remove('pulse');
            display.style.color = '#fff';
            updateSecondsDisplay();
            resetProgress();
        }

        // === 타이머 완료 ===
        function finishTimer() {
            stopAction();
            remainingSeconds = 0;
            
            const langData = translations[currentLang] || translations['en'];
            display.textContent = langData.done_msg;
            display.classList.add('pulse');
            display.style.color = '#FFD700';

            speak(langData.voice_done);
            
            uiBtnStart.style.display = 'none';
            uiBtnReset.style.display = 'block';
            updateSecondsDisplay();
        }

        // === 타이머 디스플레이 업데이트 ===
        function updateTimerDisplay() {
            const min = Math.floor(Math.max(remainingSeconds, 0) / 60);
            const sec = Math.max(remainingSeconds, 0) % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            updateSecondsDisplay();

            if (totalSeconds > 0) {
                const clamped = Math.max(0, Math.min(remainingSeconds, totalSeconds));
                const offset = singleCircleDashArray - (clamped / totalSeconds) * singleCircleDashArray;
                progressSingle.style.strokeDashoffset = offset;
            }
        }

        // === 스톱워치 디스플레이 업데이트 ===
        function updateStopwatchDisplay() {
            const hrs = Math.floor(elapsedSeconds / 3600);
            const min = Math.floor((elapsedSeconds % 3600) / 60);
            const sec = elapsedSeconds % 60;
            display.textContent = `${String(hrs).padStart(2, '0')}:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            updateSecondsDisplay();

            // 3중 원 업데이트
            // 1. 10초 원 (가장 바깥)
            const progress10 = (elapsedSeconds % 10) / 10;
            const offset10 = circle10secDashArray - (progress10 * circle10secDashArray);
            progress10sec.style.strokeDashoffset = offset10;

            // 2. 1분 원 (중간)
            const progress60 = (elapsedSeconds % 60) / 60;
            const offset60 = circle1minDashArray - (progress60 * circle1minDashArray);
            progress1min.style.strokeDashoffset = offset60;

            // 3. 60분 원 (가장 안쪽)
            const progress3600 = (elapsedSeconds % 3600) / 3600;
            const offset3600 = circle60minDashArray - (progress3600 * circle60minDashArray);
            progress60min.style.strokeDashoffset = offset3600;
        }

        // === 타이머 안내 음성 ===
        function checkTimerAnnounce(seconds) {
            if (seconds <= 0 || seconds === lastSpokenSecond) return;
            
            const langData = translations[currentLang] || translations['en'];
            let msg = "";
            let speedRate = 1.0;

            if (seconds > 60 && seconds % 60 === 0) {
                msg = langData.voice_xmin.replace('{m}', seconds / 60);
            } else if (seconds === 60) {
                msg = langData.voice_1min;
            } else if (seconds === 30) {
                msg = langData.voice_30sec;
            } else if (seconds <= 100) {
                // 1~100초 모두 카운트다운
                msg = `${seconds}`;
                // 11~100초는 1.2배 속도
                if (seconds > 10) {
                    speedRate = 1.2;
                }
            }

            if (msg) {
                speak(msg, speedRate);
                lastSpokenSecond = seconds;
            }
        }

        // === 스톱워치 안내 음성 ===
        function checkStopwatchAnnounce(seconds) {
            if (seconds === lastSpokenSecond) return; // 중복 방지
            
            const langData = translations[currentLang] || translations['en'];
            let msg = "";
            let speedRate = 1.2; // Stopwatch는 모든 구간 1.2배 (음성 겹침 방지)

            if (seconds > 0 && seconds % 3600 === 0) {
                const hrs = seconds / 3600;
                if (hrs === 1) {
                    msg = langData.voice_1hr;
                } else {
                    msg = langData.voice_xhrs.replace('{h}', hrs);
                }
            } else if (seconds > 0 && seconds % 60 === 0 && seconds < 3600) {
                const mins = seconds / 60;
                msg = langData.voice_xmin.replace('{m}', mins);
            } else if (seconds > 0 && seconds <= 100) {
                // 1~100초 모두 카운트업 (1.2배 속도)
                msg = `${seconds}`;
            }

            if (msg) {
                speak(msg, speedRate);
                lastSpokenSecond = seconds;
            }
        }

        // === 음성 출력 ===
        function speak(text, baseRate = 1.0) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = 'en-US';
            }
            
            // 기본 속도에 사용자 설정 배율 곱하기
            utterance.rate = baseRate * userSpeedMultiplier;
            utterance.pitch = 1.1;
            synth.speak(utterance);
        }

        // === 진행바 리셋 ===
        function resetProgress() {
            progressSingle.style.strokeDashoffset = 0;
            progress10sec.style.strokeDashoffset = 0;
            progress1min.style.strokeDashoffset = 0;
            progress60min.style.strokeDashoffset = 0;
        }

        // === 음성 속도 슬라이더 이벤트 ===
        speedSlider.addEventListener('input', (e) => {
            userSpeedMultiplier = parseFloat(e.target.value);
            speedValue.textContent = `${userSpeedMultiplier.toFixed(1)}x`;
        });

        // === 초기화 ===
        renderFlags();
        updateUIText('en');
    </script>
</body>
</html>
