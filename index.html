<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kids Voice Timer</title>
    <style>
        :root {
            --primary-color: #FF9F1C;
            --bg-color: #F0F4F8;
            --text-color: #2D3748;
        }
        
        body {
            font-family: 'Jua', 'Gamja Flower', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 로고 디자인 복구 및 강화 */
        h1 { 
            margin-bottom: 25px; 
            font-size: 2.2rem; 
            color: #FF6B6B; 
            text-align: center;
            text-shadow: 2px 2px 0px #fff;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }
        
        .timer-circle {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        
        .timer-circle circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }
        
        .circle-bg { stroke: #e6e6e6; }
        .circle-progress { 
            stroke: var(--primary-color); 
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #4A5568;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 350px; /* 너비 약간 증가 (긴 음성 이름 대응) */
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #CBD5E0;
            border-radius: 10px;
        }

        /* Select 박스 디자인 */
        select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #CBD5E0;
            background: white;
            width: 100%;
        }
        
        /* 옵션 그룹 스타일 (브라우저마다 다를 수 있음) */
        optgroup {
            font-weight: bold;
            color: #4A5568;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:active { transform: scale(0.98); }
        
        .btn-start { background-color: #48BB78; color: white; }
        .btn-stop { background-color: #F56565; color: white; display: none;}
        .btn-reset { background-color: #ED8936; color: white; display: none;}

        .pulse { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- 로고 영역 -->
    <h1 id="ui-title">🦊 Kids Voice Timer</h1>

    <div class="timer-container">
        <svg class="timer-circle">
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display" id="display">00:00</div>
    </div>

    <div class="controls">
        <div class="input-group" id="inputArea">
            <input type="number" id="minInput" placeholder="min" min="0" max="60" value="1">
            <input type="number" id="secInput" placeholder="sec" min="0" max="59" value="0">
        </div>

        <select id="voiceSelect">
            <option value="default" id="ui-select-default">Select Language & Voice</option>
        </select>

        <button class="btn-start" id="btn-start" onclick="startTimer()">Start ▶</button>
        <button class="btn-stop" id="btn-stop" onclick="stopTimer()">Pause ⏸</button>
        <button class="btn-reset" id="btn-reset" onclick="resetTimer()">Reset ↺</button>
    </div>

    <script>
        // 1. 다국어 딕셔너리 (로고 포함)
        const translations = {
            'en': {
                title: "🦊 Kids Voice Timer", // 로고 부활
                min_ph: "min",
                sec_ph: "sec",
                btn_start: "Start ▶",
                btn_resume: "Resume ▶",
                btn_pause: "Pause ⏸",
                btn_reset: "Reset ↺",
                done_msg: "Done!",
                voice_start: "Start",
                voice_done: "Time is up! Good job.",
                voice_1min: "One minute left.",
                voice_30sec: "Thirty seconds left.",
                voice_xmin: "{m} minutes left.",
                select_default: "Select Language"
            },
            'ko': {
                title: "🦊 키즈 보이스 타이머",
                min_ph: "분",
                sec_ph: "초",
                btn_start: "시작하기 ▶",
                btn_resume: "이어하기 ▶",
                btn_pause: "잠깐 멈춤 ⏸",
                btn_reset: "처음부터 ↺",
                done_msg: "끝!",
                voice_start: "시작",
                voice_done: "시간이 종료되었습니다! 참 잘했어요.",
                voice_1min: "1분 남았습니다.",
                voice_30sec: "30초 남았습니다.",
                voice_xmin: "{m}분 남았습니다.",
                select_default: "언어 선택 (Language)"
            },
            'ja': {
                title: "🦊 キッズボイスタイマー",
                min_ph: "分",
                sec_ph: "秒",
                btn_start: "スタート ▶",
                btn_resume: "再開 ▶",
                btn_pause: "一時停止 ⏸",
                btn_reset: "リセット ↺",
                done_msg: "終了!",
                voice_start: "スタート",
                voice_done: "時間です！よくできました。",
                voice_1min: "あと1分です。",
                voice_30sec: "あと30秒です。",
                voice_xmin: "あと{m}分です。",
                select_default: "言語を選択"
            },
            'zh': {
                title: "🦊 儿童语音计时器",
                min_ph: "分",
                sec_ph: "秒",
                btn_start: "开始 ▶",
                btn_resume: "继续 ▶",
                btn_pause: "暂停 ⏸",
                btn_reset: "重置 ↺",
                done_msg: "完成!",
                voice_start: "开始",
                voice_done: "时间到了！做得好。",
                voice_1min: "还剩1分钟。",
                voice_30sec: "还剩30秒。",
                voice_xmin: "还剩{m}分钟。",
                select_default: "选择语言"
            },
            'es': {
                title: "🦊 Temporizador de Voz",
                min_ph: "min",
                sec_ph: "seg",
                btn_start: "Iniciar ▶",
                btn_resume: "Reanudar ▶",
                btn_pause: "Pausa ⏸",
                btn_reset: "Reiniciar ↺",
                done_msg: "¡Listo!",
                voice_start: "Comienzo",
                voice_done: "¡Se acabó el tiempo! Muy bien.",
                voice_1min: "Queda un minuto.",
                voice_30sec: "Quedan treinta segundos.",
                voice_xmin: "Quedan {m} minutos.",
                select_default: "Seleccionar idioma"
            }
        };

        // 전역 상태
        let timerInterval;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let wakeLock = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let isRunning = false;
        let currentLang = 'en'; 

        const display = document.getElementById('display');
        const circleProgress = document.querySelector('.circle-progress');
        const voiceSelect = document.getElementById('voiceSelect');
        const fullDashArray = 880;

        // UI 요소
        const uiTitle = document.getElementById('ui-title');
        const uiMinInput = document.getElementById('minInput');
        const uiSecInput = document.getElementById('secInput');
        const uiBtnStart = document.getElementById('btn-start');
        const uiBtnStop = document.getElementById('btn-stop');
        const uiBtnReset = document.getElementById('btn-reset');
        const uiSelectDefault = document.getElementById('ui-select-default');

        // UI 업데이트
        function updateUIText(langCode) {
            const langData = translations[langCode] || translations['en'];
            
            document.documentElement.lang = langCode;
            currentLang = langCode;

            uiTitle.textContent = langData.title; // 로고(이모지) 포함 텍스트
            uiMinInput.placeholder = langData.min_ph;
            uiSecInput.placeholder = langData.sec_ph;
            uiSelectDefault.textContent = langData.select_default;

            if(isRunning) {
                uiBtnStop.textContent = langData.btn_pause;
            } else {
                if(remainingSeconds > 0 && remainingSeconds < totalSeconds) {
                    uiBtnStart.textContent = langData.btn_resume;
                } else {
                    uiBtnStart.textContent = langData.btn_start;
                }
            }
            uiBtnReset.textContent = langData.btn_reset;
        }

        updateUIText('en');

        // --- 2. 개선된 음성 목록 로딩 (국가별 그룹화) ---
        function populateVoiceList() {
            let voices = synth.getVoices();
            
            voiceSelect.innerHTML = '';
            voiceSelect.appendChild(uiSelectDefault);

            if (voices.length > 0) {
                // 1. 그룹핑을 위한 맵 생성
                const groups = {};
                // 언어 이름 변환기 (Intl API 활용)
                const langNames = new Intl.DisplayNames(['en'], { type: 'language' });

                voices.forEach((voice, index) => {
                    const langCode = voice.lang; 
                    const baseLang = langCode.split('-')[0]; // en, ko, ja...
                    
                    // 그룹 이름 결정 (예: Korean, English, Japanese...)
                    let groupName;
                    try {
                        groupName = langNames.of(baseLang); 
                    } catch(e) {
                        groupName = baseLang; // 실패 시 코드 사용
                    }

                    if(!groups[groupName]) groups[groupName] = [];
                    
                    // 그룹에 음성 정보 추가 (원래 인덱스 유지 중요!)
                    groups[groupName].push({
                        name: voice.name,
                        lang: voice.lang,
                        index: index // 원래 배열의 인덱스 저장
                    });
                });

                // 2. 그룹 정렬 (한국어, 영어를 맨 위로)
                const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
                    // 우선순위 정의
                    const priority = ['Korean', 'English']; 
                    const idxA = priority.indexOf(a);
                    const idxB = priority.indexOf(b);

                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });

                // 3. DOM 생성
                sortedGroupKeys.forEach(groupKey => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = groupKey; // 상위 그룹 이름 (국가/언어)

                    groups[groupKey].forEach(v => {
                        const option = document.createElement('option');
                        option.textContent = v.name; // 하위: 세부 음성 이름
                        option.value = v.index; // 값은 원래 인덱스 사용
                        option.setAttribute('data-lang', v.lang);
                        optgroup.appendChild(option);
                    });

                    voiceSelect.appendChild(optgroup);
                });
            }
        }

        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // 음성 선택 핸들러
        voiceSelect.addEventListener('change', () => {
            const index = voiceSelect.value;
            
            if (index === 'default') {
                selectedVoice = null;
                updateUIText('en');
            } else {
                const voices = synth.getVoices();
                // value에 저장된 원래 인덱스로 음성 찾기
                selectedVoice = voices[index]; 
                
                if (selectedVoice) {
                    const langCode = selectedVoice.lang.split('-')[0];
                    updateUIText(langCode);
                }
            }
        });

        // --- 타이머 로직 (기존 동일) ---
        async function startTimer() {
            if (isRunning) return;

            if (remainingSeconds === 0) {
                const min = parseInt(uiMinInput.value) || 0;
                const sec = parseInt(uiSecInput.value) || 0;
                totalSeconds = min * 60 + sec;
                remainingSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) return alert("Time?");

            uiBtnStart.style.display = 'none';
            uiBtnStop.style.display = 'block';
            uiBtnReset.style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            voiceSelect.style.display = 'none';

            const langData = translations[currentLang] || translations['en'];
            uiBtnStop.textContent = langData.btn_pause;

            isRunning = true;
            speak(langData.voice_start);

            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log('WakeLock error:', err); }

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;
            updateDisplay();

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const currentRemaining = initialRemaining - elapsed;

                if (currentRemaining !== remainingSeconds) {
                    remainingSeconds = currentRemaining;
                    updateDisplay();
                    checkAnnounce(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 200);
        }

        function stopTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;
            
            const langData = translations[currentLang] || translations['en'];
            
            uiBtnStart.textContent = langData.btn_resume;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.textContent = langData.btn_reset;
            uiBtnReset.style.display = 'block';
            
            if (wakeLock) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = 0;
            totalSeconds = 0;
            
            const langData = translations[currentLang] || translations['en'];

            uiBtnStart.textContent = langData.btn_start;
            uiBtnStart.style.display = 'block';
            uiBtnStop.style.display = 'none';
            uiBtnReset.style.display = 'none';
            document.getElementById('inputArea').style.display = 'flex';
            voiceSelect.style.display = 'block';
            
            display.classList.remove('pulse');
            display.style.color = '#4A5568';
            display.textContent = "00:00";
            circleProgress.style.strokeDashoffset = 0;
        }

        function finishTimer() {
            stopTimer();
            remainingSeconds = 0;
            updateDisplay();
            
            const langData = translations[currentLang] || translations['en'];

            display.textContent = langData.done_msg;
            display.classList.add('pulse');
            display.style.color = '#F56565';
            
            speak(langData.voice_done);
            
            uiBtnStart.style.display = 'none';
            uiBtnReset.style.display = 'block';
        }

        function updateDisplay() {
            const min = Math.floor(Math.max(remainingSeconds, 0) / 60);
            const sec = Math.max(remainingSeconds, 0) % 60;
            display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            if (totalSeconds > 0) {
                const clamped = Math.max(0, Math.min(remainingSeconds, totalSeconds));
                const offset = fullDashArray - (clamped / totalSeconds) * fullDashArray;
                circleProgress.style.strokeDashoffset = offset;
            }
        }

        function checkAnnounce(seconds) {
            if (seconds <= 0) return;
            
            const langData = translations[currentLang] || translations['en'];
            let msg = "";

            if (seconds > 60 && seconds % 60 === 0) {
                msg = langData.voice_xmin.replace('{m}', seconds / 60);
            } 
            else if (seconds === 60) {
                msg = langData.voice_1min;
            } 
            else if (seconds === 30) {
                msg = langData.voice_30sec;
            } 
            else if (seconds <= 10) {
                msg = `${seconds}`;
            }

            if (msg) speak(msg);
        }

        function speak(text) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = 'en-US';
            }
            
            utterance.rate = 1.0;
            utterance.pitch = 1.1;
            synth.speak(utterance);
        }
    </script>
</body>
</html>
